<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Piano</title>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="title" id="appTitle">PIANO<span>●</span></div>
    <button class="btn play" id="btnPlay" title="Jugar">🎮 Jugar</button>
    <button class="btn" id="btnZoomOut" title="Teclas más chicas">
      <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
    <button class="btn" id="btnZoomIn" title="Teclas más grandes">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
    <button class="btn" id="btnSustain" title="Pedal de sustain">Pedal</button>
    <button class="btn" id="btnLabels" title="Nombres de las notas">Notas: Do</button>
    <div class="vol" title="Volumen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
    </div>
    <div class="spacer"></div>
    <div id="status">Cargando sonido…</div>
    <button class="btn" id="btnTheme" title="Cambiar estilo">👑</button>
    <button class="btn" id="btnFull" title="Pantalla completa">
      <svg id="icoFull" viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg>
      <svg id="icoExit" viewBox="0 0 24 24" style="display:none"><path d="M8 5h2v5H5V8h3V5zm6 0h2v3h3v2h-5V5zM5 14h5v5H8v-3H5v-2zm9 0h5v2h-3v3h-2v-5z"/></svg>
    </button>
  </div>

  <div id="hud" hidden>
    <button class="btn" id="hudPause" title="Pausa"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
    <div class="hud-song"><span id="hudEmoji"></span><span id="hudName"></span></div>
    <div class="hud-prog"><div id="hudProg"></div></div>
    <div class="hud-combo" id="hudCombo"></div>
    <div class="hud-score" id="hudScore">0</div>
  </div>

  <div id="stage"><div id="kb"><div id="keys"></div></div></div>

  <div id="mini">
    <div id="miniInner">
      <canvas id="miniCanvas"></canvas>
      <div id="miniClip"><div id="miniWin"></div></div>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<!-- Inicio -->
<div class="overlay" id="startOverlay">
  <div class="card">
    <div style="font-size:54px" id="startIcon">🎹</div>
    <h2 id="startTitle">Piano de 88 teclas</h2>
    <p>Deslizá el recuadro de abajo para moverte por el teclado.<br>Tocá <b>🎮 Jugar</b> para aprender canciones.</p>
    <button class="btn on" id="btnStartFull">Pantalla completa</button>
    <button class="btn" id="btnStart">Tocar así</button>
  </div>
</div>

<!-- Girar -->
<div class="overlay" id="rotateOverlay">
  <div class="card">
    <svg class="rotate-icon" viewBox="0 0 24 24"><path d="M16.5 1h-9A2.5 2.5 0 0 0 5 3.5v17A2.5 2.5 0 0 0 7.5 23h9a2.5 2.5 0 0 0 2.5-2.5v-17A2.5 2.5 0 0 0 16.5 1zM14 21h-4v-1h4v1zm3-3H7V4h10v14z"/></svg>
    <h2>Girá el teléfono</h2>
    <p>El piano se toca mejor en horizontal.</p>
    <button class="btn" id="btnRotateDismiss">Seguir en vertical</button>
  </div>
</div>

<!-- Elegir canción -->
<div class="overlay" id="pickerOverlay">
  <div class="panel">
    <div class="panel-head">
      <h2 id="pickTitle">¿Qué tocamos hoy?</h2>
      <div class="rank" id="rank"></div>
      <button class="btn" id="pickClose" title="Cerrar">✕</button>
    </div>
    <div class="row">
      <div class="seg" id="modeSeg">
        <button data-mode="learn">🎓 Aprender<small>Las notas te esperan</small></button>
        <button data-mode="rhythm">🎯 Desafío<small>Tocá justo a tiempo</small></button>
      </div>
      <label class="tempo">🐢 <input type="range" id="tempo" min="0.4" max="1.5" step="0.05" value="1"> 🐇 <b id="tempoLbl">100%</b></label>
    </div>
    <div class="tabs" id="levelTabs">
      <button class="btn" data-level="1">🌱 Fácil</button>
      <button class="btn" data-level="2">🌸 Medio</button>
      <button class="btn" data-level="3">🔥 Difícil</button>
    </div>
    <div class="songs" id="songList"></div>
  </div>
</div>

<!-- Pausa -->
<div class="overlay" id="pauseOverlay">
  <div class="card">
    
    <h2>Pausa</h2>
    <button class="btn on" id="btnResume">▶ Seguir</button>
    <button class="btn" id="btnRestart">🔁 Empezar de nuevo</button>
    <button class="btn" id="btnPauseSongs">🎵 Otra canción</button>
    <button class="btn" id="btnQuit">🏠 Salir</button>
  </div>
</div>

<!-- Resultados -->
<div class="overlay" id="resultOverlay">
  <div class="card result">
    <h2 id="resTitle">¡Muy bien!</h2>
    <div id="resSong" style="opacity:.8"></div>
    <div class="bigstars" id="resStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="score-big" id="resScore">0</div>
    <div id="resRecord" class="record" hidden>🏆 ¡Nuevo récord!</div>
    <div class="stats" id="resStats"></div>
    <button class="btn on" id="btnAgain">🔁 Otra vez</button>
    <button class="btn" id="btnResSongs">🎵 Otra canción</button>
    <button class="btn" id="btnResQuit">🏠 Salir</button>
  </div>
</div>

<div id="toast"></div>

<script src="js/songs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
